name: Update app list

on:
  push:
    branches: [main]
    paths:
      - 'scraper/**'
      - 'tests/**'
      - 'data/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scraper/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-app-list-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checks
        run: pytest -q

      - name: Update application list
        run: python -m scraper.main

      - name: Show generated list changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF" --depth=1
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def ids(raw: str) -> set[str]:
              return {item.strip() for item in raw.replace("\n", ",").split(",") if item.strip()}

          def base_file(ref: str, path: str) -> set[str]:
              proc = subprocess.run(
                  ["git", "show", f"origin/{ref}:{path}"],
                  text=True,
                  capture_output=True,
              )
              return ids(proc.stdout) if proc.returncode == 0 else set()

          def current_file(path: str) -> set[str]:
              file = Path(path)
              return ids(file.read_text(encoding="utf-8")) if file.exists() else set()

          base_ref = os.environ["BASE_REF"]
          status = json.loads(Path("public/status.json").read_text(encoding="utf-8"))

          base_direct = base_file(base_ref, "public/direct_apps.txt") or base_file(base_ref, "public/app_ids.txt")
          base_proxy = base_file(base_ref, "public/proxy_apps.txt")
          current_direct = current_file("public/direct_apps.txt")
          current_proxy = current_file("public/proxy_apps.txt")

          direct_added = sorted(current_direct - base_direct)
          direct_removed = sorted(base_direct - current_direct)
          proxy_added = sorted(current_proxy - base_proxy)
          proxy_removed = sorted(base_proxy - current_proxy)

          lines = [
              "## Generated split-tunnel lists",
              "",
              f"DIRECT: **{status.get('direct_count', 0)}** · "
              f"PROXY: **{status.get('proxy_count', 0)}** · "
              f"Candidates: **{status.get('candidate_count', 0)}**",
              "",
              f"DIRECT added ({len(direct_added)}): " + (", ".join(f"`{x}`" for x in direct_added) or "none"),
              "",
              f"DIRECT removed ({len(direct_removed)}): " + (", ".join(f"`{x}`" for x in direct_removed) or "none"),
              "",
              f"PROXY added ({len(proxy_added)}): " + (", ".join(f"`{x}`" for x in proxy_added) or "none"),
              "",
              f"PROXY removed ({len(proxy_removed)}): " + (", ".join(f"`{x}`" for x in proxy_removed) or "none"),
          ]
          report = "\n".join(lines)
          print(report)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write(report + "\n")
          PY

      - name: Commit updates
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: update app list $(date -u +%F)"
          git push
